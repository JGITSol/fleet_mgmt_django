# Project configuration for Ruff and isort

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
    "car_fleet_manager_frontend/**",
    "build/**",
    "dist/**",
]
ignore = ["RUF012", "S101"]

# Per-file ignores to reduce noise from autogenerated files and tests
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/migrations/*.py" = ["RUF012"]
"car_fleet_manager_frontend/**" = ["F821", "F841"]
"**/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603"]
"**/*/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603"]
"**/test_*.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"**/*_test.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"**/migrations/**" = ["RUF012"]
"CarFleetManagement/**/migrations/*.py" = ["RUF012"]

# Helper scripts that intentionally set DJANGO_SETTINGS_MODULE or call django.setup()
"**/debug_urls.py" = ["E402"]
"**/fix_migrations.py" = ["E402"]
"**/fix_database_schema.py" = ["E402"]
"**/setup_dev_credentials.py" = ["E402"]
"**/setup_test_user.py" = ["E402"]
"**/simple_test_user.py" = ["E402"]
"**/comprehensive_ui_test.py" = ["E402"]
"**/run_patched_tests.py" = ["E402"]
"**/test_django_urls.py" = ["E402"]
"**/conftest.py" = ["E402"]
"comprehensive_ui_test.py" = ["F821", "E402"]
"apply_jwt_patch.py" = ["E402"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["CarFleetManagement"]

## Legacy compatibility: keep per-file-ignores at top-level for older ruff versions
[tool.ruff.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/migrations/*.py" = ["RUF012"]
"car_fleet_manager_frontend/**" = ["F821", "F841"]
"**/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603"]
"CarFleetManagement/**/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603"]
"**/*/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603"]
"**/test_*.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"**/*_test.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"**/migrations/**" = ["RUF012"]
