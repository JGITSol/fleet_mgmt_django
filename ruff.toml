line-length = 88
target-version = "py311"
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
    "car_fleet_manager_frontend/**",
    "build/**",
    "dist/**",
]

[lint]
ignore = ["RUF012", "S101", "S105", "S106", "E402", "S603", "C901", "S110", "PGH003"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/migrations/*" = ["RUF012"]
"car_fleet_manager_frontend/**" = ["F821", "F841"]
"**/tests/**" = ["S101", "S106", "S105", "E402", "F401", "F403", "F821", "F841", "SIM105", "S603", "B018"]
"**/test_*.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"**/*_test.py" = ["S101", "E402", "S105", "S106", "F821", "F401", "F403", "RUF012", "S603", "TRY003", "S607"]
"CarFleetManagement/api/gemini_client.py" = ["C901"]

# Utility scripts that intentionally call subprocess with controlled args
"run_tests_with_coverage.py" = ["S603"]
"CarFleetManagement/scripts/*.py" = ["S603", "F401"]
"scripts/*.py" = ["S603", "F401", "E402"]

# Helper scripts that intentionally set DJANGO_SETTINGS_MODULE or call django.setup()
"**/debug_urls.py" = ["E402"]
"**/fix_migrations.py" = ["E402"]
"**/fix_database_schema.py" = ["E402"]
"**/setup_dev_credentials.py" = ["E402"]
"**/setup_test_user.py" = ["E402"]
"**/simple_test_user.py" = ["E402"]
"**/comprehensive_ui_test.py" = ["E402"]
"**/run_patched_tests.py" = ["E402"]
"**/test_django_urls.py" = ["E402"]
"**/conftest.py" = ["E402"]
"comprehensive_ui_test.py" = ["F821", "E402"]
"apply_jwt_patch.py" = ["E402"]
