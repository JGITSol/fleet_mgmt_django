name: CI

on:
  push:
    branches:
      - feature/ci-and-url-fixes
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create virtualenv and install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./car_fleet_manager_frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: ./car_fleet_manager_frontend
        run: |
          npm run build
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=ci-secret
          DJANGO_DEBUG=True
          GEMINI_API_KEY=fake-ci-key
          OPENROUTER_API_KEY=fake-ci-key
          GOOGLE_API_USE_CLIENT_CERTIFICATE=false
          EOF
      - name: Run tests
        run: |
          pytest -q
      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
