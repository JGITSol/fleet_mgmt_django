name: CI

on:
  push:
    branches:
      - feature/ci-and-url-fixes
  pull_request:
    branches:
      - main

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for linters
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.0 flake8==6.1.0 isort==5.12.0

      - name: Run ruff (fixable)
        run: |
          ruff check .

      - name: Run isort (check)
        run: |
          isort --check-only --diff

      - name: Run flake8
        run: |
          flake8

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip for backend
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-backend-${{ hashFiles('**/requirements.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create virtualenv and install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Reflex frontend
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Reflex and frontend Python deps
        working-directory: ./car_fleet_manager_frontend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('car_fleet_manager_frontend/requirements.txt') }}

      - name: Setup bun (official action)
        uses: oven-sh/setup-bun@v1
        with:
          version: '1'

      - name: Build Reflex frontend
        working-directory: ./car_fleet_manager_frontend
        run: |
          python -m reflex build
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=ci-secret
          DJANGO_DEBUG=True
          GEMINI_API_KEY=fake-ci-key
          OPENROUTER_API_KEY=fake-ci-key
          GOOGLE_API_USE_CLIENT_CERTIFICATE=false
          EOF
      - name: Run tests
        run: |
          pytest -q
      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
