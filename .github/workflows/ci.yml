name: CI

on:
  push:
    branches:
      - feature/ci-and-url-fixes
  pull_request:
    branches:
      - main

jobs:
  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for linters
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.0 flake8==6.1.0 isort==5.12.0

      - name: Run ruff (check)
        run: |
          ruff check .

      - name: Run isort (check)
        run: |
          isort --check-only --diff

      - name: Run flake8
        run: |
          flake8

  test:
    runs-on: ubuntu-latest
    needs: linters
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=ci-secret
          DJANGO_DEBUG=True
          GEMINI_API_KEY=fake-ci-key
          OPENROUTER_API_KEY=fake-ci-key
          GOOGLE_API_USE_CLIENT_CERTIFICATE=false
          EOF

      - name: Run tests
        run: |
          pytest -q

      - name: Upload coverage (if generated)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
