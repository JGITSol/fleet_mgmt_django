openapi: 3.0.3
info:
  title: Fleet Management API
  version: 1.0.0
  description: API documentation for the Fleet Management system
paths:
  /api/v1/:
    get:
      operationId: api_v1_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Register a new user and return JWT tokens.

        Parameters
        ----------
        request : rest_framework.request.Request
            The HTTP request containing registration data.

        Returns
        -------
        rest_framework.response.Response
            JSON with user data and JWT tokens or validation errors.
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
