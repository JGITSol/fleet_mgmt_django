  /api/v1/auth/profile/:
    get:
      operationId: api_v1_auth_profile_retrieve
      description: |-
        Retrieve the authenticated user's profile.

        Parameters
        ----------
        request : rest_framework.request.Request
            The HTTP request (must be authenticated).

        Returns
        -------
        rest_framework.response.Response
