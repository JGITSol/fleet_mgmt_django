components:
  schemas:
    Driver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        full_name:
          type: string
          readOnly: true
        driver_license_number:
          type: string
          maxLength: 50
        assigned_vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleNested'
          readOnly: true
        phone_number:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - assigned_vehicles
      - driver_license_number
      - first_name
      - full_name
      - id
      - last_name
    DriverNested:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        full_name:
          type: string
          readOnly: true
      required:
      - first_name
      - full_name
      - id
      - last_name
    EmergencyIncident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        vehicle:
          type: integer
        driver:
          allOf:
          - $ref: '#/components/schemas/Driver'
          readOnly: true
        reported_by:
          type: integer
          readOnly: true
        emergency_type:
          $ref: '#/components/schemas/EmergencyTypeEnum'
        status:
          $ref: '#/components/schemas/EmergencyIncidentStatusEnum'
        location:
          type: string
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        description:
          type: string
        reported_time:
          type: string
          format: date-time
          readOnly: true
        resolved_time:
          type: string
          format: date-time
          nullable: true
        attachment:
          type: string
          format: uri
          nullable: true
        video_attachment:
          type: string
          format: uri
          nullable: true
        attachment_url:
          type: string
          readOnly: true
      required:
      - attachment_url
      - driver
      - id
      - reported_by
      - reported_time
      - vehicle
    EmergencyIncidentStatusEnum:
      enum:
      - REPORTED
      - RESPONDING
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `REPORTED` - Reported
        * `RESPONDING` - Responding
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    EmergencyResponse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        incident:
          type: integer
        responder:
          type: integer
          readOnly: true
        response_time:
          type: string
          format: date-time
          readOnly: true
        action_taken:
          type: string
          nullable: true
        notes:
          type: string
        attachment:
          type: string
          format: uri
          nullable: true
          title: Response Attachment
      required:
      - id
      - incident
      - responder
      - response_time
    EmergencyTypeEnum:
      enum:
      - ACCIDENT
      - BREAKDOWN
      - MEDICAL
      - THEFT
      - OTHER
      type: string
      description: |-
        * `ACCIDENT` - Accident
        * `BREAKDOWN` - Breakdown
        * `MEDICAL` - Medical Emergency
        * `THEFT` - Theft
        * `OTHER` - Other
    FuelTypeEnum:
      enum:
      - DIESEL
      - PETROL
      - HYBRID
      - ELECTRIC
      type: string
      description: |-
        * `DIESEL` - Diesel
        * `PETROL` - Petrol
        * `HYBRID` - Hybrid
        * `ELECTRIC` - Electric
    Maintenance:
      type: object
      description: |-
        Serializer for the Maintenance model.
        Provides detailed information about maintenance records, including days until scheduled and vehicle details.
      properties:
        id:
          type: integer
          readOnly: true
        vehicle:
          type: integer
          description: ID of the vehicle for this maintenance.
        vehicle_details:
          allOf:
          - $ref: '#/components/schemas/Vehicle'
          readOnly: true
        maintenance_type:
          allOf:
          - $ref: '#/components/schemas/MaintenanceTypeEnum'
          description: |-
            Type of maintenance (routine, repair, inspection, etc).

            * `ROUTINE` - Routine Maintenance
            * `REPAIR` - Repair
            * `INSPECTION` - Inspection
            * `OTHER` - Other
        status:
          allOf:
          - $ref: '#/components/schemas/MaintenanceStatusEnum'
          title: Maintenance Status
          description: |-
            Current status of the maintenance.

            * `SCHEDULED` - Scheduled
            * `IN_PROGRESS` - In Progress
            * `COMPLETED` - Completed
            * `CANCELLED` - Cancelled
        description:
          type: string
          title: Maintenance Description
          description: Description of the maintenance work.
        scheduled_date:
          type: string
          format: date
          description: Date the maintenance is scheduled for.
        completed_date:
          type: string
          format: date
          nullable: true
          description: Date the maintenance was completed.
        odometer_reading:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Odometer reading at the time of maintenance.
        cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Maintenance Cost
          description: Cost of the maintenance.
        service_provider:
          type: string
          description: Provider performing the maintenance.
          maxLength: 100
        notes:
          type: string
          title: Additional Notes
          description: Additional notes about the maintenance.
        days_until_scheduled:
          type: string
          readOnly: true
      required:
      - cost
      - days_until_scheduled
      - description
      - id
      - odometer_reading
      - scheduled_date
      - service_provider
      - vehicle
      - vehicle_details
    MaintenanceStatusEnum:
      enum:
      - SCHEDULED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
