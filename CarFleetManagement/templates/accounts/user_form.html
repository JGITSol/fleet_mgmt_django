{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h2>{% if object %}Edit User{% else %}Add User{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button class="btn btn-success" type="submit">Save</button>
  <a class="btn btn-secondary" href="{% url 'user-list' %}">Cancel</a>
</form>
{% endblock %}
