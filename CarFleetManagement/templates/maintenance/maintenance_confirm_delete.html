{% extends "base.html" %}
{% block content %}
<h2>Delete Maintenance Record</h2>
<p>Are you sure you want to delete this maintenance record for vehicle <strong>{{ object.vehicle }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'maintenance-list' %}">Cancel</a>
</form>
{% endblock %}
