{% extends "base_v2.html" %}
{% block content %}
<h2>Delete Vehicle</h2>
<p>Are you sure you want to delete vehicle <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'vehicle-list' %}">Cancel</a>
</form>
{% endblock %}
